<body>
<style>
   /* FONDO GENERAL DE LA PÁGINA */
   body {
       font-family: Arial, sans-serif; 
       background: linear-gradient(135deg, #ffd6e0, #fff0f5, #ffe4ec);  
       margin: 0; 
       padding: 0;
       color: #fff; 
   }
</style>

<!-- Contenedor principal del formulario -->
<div class="contenedor">

    <!-- Título de la página -->
    <h1 style="color: black;">Contacto</h1>

    <!-- Descripción para el usuario -->
    <p style="color: black;">Estamos listos para atender tus dudas y pedidos especiales</p>

    <!-- Información de contacto -->
    <p style="color: black;"><strong>Whatsapp:</strong>926 766 248/924 315 575</p>
    <p style="color: black;"><strong>Correo</strong> Eldulcesaber@gmail.com</p>

    <!-- Formulario de contacto -->
    <form>

        <!-- Campo para ingresar nombre -->
        <label style="color: black;">Nombre:</label><br>
        <input type="text" placeholder="Tu nombre"><br><br>

        <!-- Campo para ingresar correo -->
        <label style="color: black;">Correo:</label><br>
        <input type="email" placeholder="Tu correo"><br><br>

        <!-- Campo para escribir mensaje -->
        <label style="color: black;">Mensaje:</label><br>
        <textarea placeholder="Escribe tu mensaje"></textarea><br><br>

        <!-- Botón para enviar el formulario -->
        <button type="submit">Enviar</button>
    </form>
</div>
